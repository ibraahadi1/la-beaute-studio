<title>La Beauté Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    --ground:#FBF5F3;
    --surface:#FFFFFF;
    --surface-2:#F6EAE6;
    --ink:#2B2130;
    --ink-soft:#7A6873;
    --accent:#B76E79;
    --accent-deep:#7A3B49;
    --gold:#A9824F;
    --line:#EADAD4;
    --focus:#7A3B49;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1E1720; --surface:#271E29; --surface-2:#332531;
      --ink:#F3E9E6; --ink-soft:#C6B3BE; --accent:#E3A5AF;
      --accent-deep:#F0C0C8; --gold:#D2B27C; --line:#40303C; --focus:#E3A5AF;
    }
  }
  :root[data-theme="dark"]{
    --ground:#1E1720; --surface:#271E29; --surface-2:#332531;
    --ink:#F3E9E6; --ink-soft:#C6B3BE; --accent:#E3A5AF;
    --accent-deep:#F0C0C8; --gold:#D2B27C; --line:#40303C; --focus:#E3A5AF;
  }

  *{box-sizing:border-box;}
  body{background:var(--ground);}
  html{scroll-behavior:smooth;}

  #app{
    background:var(--ground); color:var(--ink);
    font-family:'Cairo','Work Sans','Noto Sans',system-ui,sans-serif;
    line-height:1.7; direction:rtl;
  }
  #app:not(.lang-ar){font-family:'Work Sans','Noto Sans',system-ui,sans-serif;}
  #app[dir="ltr"]{direction:ltr;}

  h1,h2,h3{font-family:'Fraunces','Cairo',serif;text-wrap:balance;margin:0;font-weight:600;}
  #app:not(.lang-ar) h1,#app:not(.lang-ar) h2,#app:not(.lang-ar) h3{font-family:'Fraunces','Georgia',serif;}
  a{color:inherit;}
  img,svg{max-width:100%;}
  button{font:inherit;}

  .wrap{max-width:920px;margin:0 auto;padding:0 20px;}

  /* ---------- Header / nav ---------- */
  .site-header{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;max-width:920px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;white-space:nowrap;flex:none;}
  .nav-links{display:flex;align-items:center;gap:20px;list-style:none;margin:0;padding:0;}
  .nav-links a{font-size:.92rem;font-weight:600;text-decoration:none;color:var(--ink-soft);transition:color .15s;}
  .nav-links a:hover{color:var(--accent-deep);}
  .nav-actions{display:flex;align-items:center;gap:8px;flex:none;}

  .lang-select{
    appearance:none;-webkit-appearance:none;
    border:1px solid var(--line);background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237A6873" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 9px center/12px;
    color:var(--ink);border-radius:99px;padding:8px 30px 8px 14px;
    font-weight:700;font-size:.82rem;cursor:pointer;flex:none;max-width:112px;
  }
  #app[dir="rtl"] .lang-select{background-position:left 9px center;padding:8px 14px 8px 30px;}
  .lang-select:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .menu-btn{
    display:none;border:1px solid var(--line);background:var(--surface);
    border-radius:9px;width:38px;height:38px;cursor:pointer;color:var(--ink);
    align-items:center;justify-content:center;flex:none;
  }
  .menu-btn svg{width:20px;height:20px;}

  .mobile-panel{display:none;}
  .mobile-panel:not([hidden]){
    border-top:1px solid var(--line);padding:14px 20px 18px;
    display:flex;flex-direction:column;gap:14px;background:var(--surface);
  }
  .mobile-panel a{font-weight:700;text-decoration:none;color:var(--ink);}

  @media (max-width:760px){
    .nav-links{display:none;}
    .menu-btn{display:flex;}
  }
  @media (max-width:380px){
    .brand span.wordmark{display:none;}
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.98rem;
    padding:13px 26px;border-radius:10px;border:1px solid transparent;
    cursor:pointer;text-decoration:none;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .btn-primary{background:var(--accent-deep);color:#fff;box-shadow:0 6px 18px color-mix(in srgb, var(--accent-deep) 35%, transparent);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn svg{width:18px;height:18px;flex:none;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:
      radial-gradient(560px 320px at 85% -10%, color-mix(in srgb, var(--accent) 28%, transparent), transparent),
      radial-gradient(480px 300px at -10% 100%, color-mix(in srgb, var(--gold) 20%, transparent), transparent),
      var(--surface);
    border-bottom:1px solid var(--line);
    padding:48px 0 40px;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:.78rem;
    color:var(--accent-deep);background:color-mix(in srgb, var(--accent) 14%, var(--surface));
    border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    padding:6px 14px;border-radius:99px;margin-bottom:18px;font-weight:600;
  }
  .hero h1{font-size:clamp(1.9rem,4.6vw,2.7rem);}
  .hero p.lede{max-width:56ch;color:var(--ink-soft);font-size:1.05rem;margin-top:14px;}
  .hero-cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;}

  /* ---------- Steps strip ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .step .n{
    width:28px;height:28px;border-radius:50%;background:var(--accent-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;
    font-family:'Fraunces',serif;margin-bottom:10px;
  }
  .step p{margin:0;font-size:.88rem;color:var(--ink-soft);}
  .step strong{display:block;font-size:.95rem;margin-bottom:4px;}
  @media (max-width:700px){.steps{grid-template-columns:1fr;}}

  /* ---------- Sections ---------- */
  section{padding:54px 0;border-bottom:1px solid var(--line);}
  section:last-of-type{border-bottom:none;}
  .section-head{margin-bottom:28px;max-width:64ch;}
  .section-head h2{font-size:clamp(1.45rem,3vw,1.85rem);}
  .section-head p{color:var(--ink-soft);margin-top:8px;}
  .icon-badge{
    width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--accent) 16%, var(--surface));color:var(--accent-deep);margin-bottom:14px;
  }
  .icon-badge svg{width:20px;height:20px;}

  /* ---------- About ---------- */
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .about-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .about-card p{margin:0;}
  .pill-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  .pill{font-size:.85rem;background:var(--surface-2);border:1px solid var(--line);padding:7px 14px;border-radius:99px;}
  @media (max-width:700px){.about-grid{grid-template-columns:1fr;}}

  /* ---------- Offer banner ---------- */
  .offer{
    background:linear-gradient(135deg, var(--accent-deep), var(--accent));color:#fff;
    border-radius:16px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .offer .price-old{opacity:.75;text-decoration:line-through;font-size:.88em;}
  .offer h3{color:#fff;font-size:1.2rem;}
  .offer .amt{font-size:1.4rem;font-weight:700;font-family:'Fraunces',serif;}

  /* ---------- Pricing tabs ---------- */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .tab{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    border-radius:99px;padding:8px 16px;font-size:.88rem;font-weight:700;cursor:pointer;
  }
  .tab[aria-selected="true"]{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
  .tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .price-group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;}
  .price-group h4{font-weight:700;font-size:1.02rem;margin-bottom:6px;}
  .price-sub{font-size:.82rem;font-weight:700;color:var(--gold);margin:14px 0 2px;}
  .price-sub:first-of-type{margin-top:6px;}
  .price-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums;}
  .price-row:first-of-type,.price-sub + .price-row{border-top:none;}
  .price-row .val{color:var(--accent-deep);font-weight:700;white-space:nowrap;}
  .note{font-size:.85rem;color:var(--ink-soft);margin-top:6px;display:flex;gap:8px;align-items:flex-start;}
  .note svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--gold);}

  /* ---------- Form ---------- */
  .consult{background:var(--surface-2);}
  form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;}
  fieldset{border:none;margin:0;padding:22px 22px 26px;}
  fieldset + fieldset{border-top:1px solid var(--line);}
  legend{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;padding:0;margin-bottom:18px;width:100%;}
  legend .num{
    font-family:'Fraunces',serif;font-weight:600;width:30px;height:30px;border-radius:50%;
    background:var(--accent-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex:none;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  label{font-size:.9rem;font-weight:600;}
  input[type=text],input[type=tel],textarea,select.form-select{
    font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);
    border-radius:9px;padding:11px 12px;width:100%;
  }
  input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  textarea{resize:vertical;min-height:76px;}
  .radio-row,.check-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:.9rem;font-weight:400;cursor:pointer;background:var(--ground);}
  .opt input{width:16px;height:16px;flex:none;accent-color:var(--accent-deep);}
  .opt:has(input:checked){border-color:var(--accent-deep);background:color-mix(in srgb, var(--accent) 14%, var(--ground));}
  .length-guide{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .length-guide svg{flex:none;}
  .deposit-box{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .deposit-box input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent-deep);flex:none;}
  .deposit-box label{font-weight:600;font-size:.92rem;}
  .form-footer{padding:6px 22px 22px;display:flex;flex-direction:column;gap:12px;}
  .form-msg{font-size:.85rem;color:var(--accent-deep);min-height:1.2em;font-weight:600;}

  @media (max-width:640px){
    .field-grid{grid-template-columns:1fr;}
    .check-grid{grid-template-columns:1fr;}
    .offer{flex-direction:column;align-items:flex-start;}
  }

  /* ---------- Footer ---------- */
  footer{padding:40px 0 90px;}
  .foot-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .foot-card strong{display:block;margin-bottom:4px;}
  .foot-card .sub{color:var(--ink-soft);font-size:.88rem;}

  .wa-float{
    position:fixed;inset-inline-end:18px;inset-block-end:18px;width:56px;height:56px;border-radius:50%;
    background:var(--accent-deep);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px color-mix(in srgb, var(--accent-deep) 45%, transparent);text-decoration:none;z-index:20;
  }
  .wa-float svg{width:26px;height:26px;}
</style>

<div id="app" class="lang-ar" dir="rtl" lang="ar">

  <header class="site-header">
    <div class="nav-row">
      <div class="brand"><span>🌸</span>
        <span class="wordmark" data-i18n="brand"></span>
      </div>
      <ul class="nav-links">
        <li><a href="#about" data-i18n="nav_about"></a></li>
        <li><a href="#pricing" data-i18n="nav_pricing"></a></li>
        <li><a href="#booking" data-i18n="nav_booking"></a></li>
        <li><a href="#contact" data-i18n="nav_contact"></a></li>
      </ul>
      <div class="nav-actions">
        <select class="lang-select" id="langSelect" aria-label="Language / اللغة / Sprache">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="it">Italiano</option>
          <option value="tr">Türkçe</option>
        </select>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
    <nav class="mobile-panel" id="mobilePanel" hidden>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#pricing" data-i18n="nav_pricing"></a>
      <a href="#booking" data-i18n="nav_booking"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
  </header>

  <header class="hero">
    <div class="wrap">
      <span class="eyebrow">🌸 <span data-i18n="eyebrow"></span></span>
      <h1 data-i18n="hero_h1"></h1>
      <p class="lede" data-i18n="hero_lede"></p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="#booking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v4M16 2v4M3.5 9h17M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
          <span data-i18n="hero_book_now"></span>
        </a>
        <a class="btn btn-ghost" href="#pricing"><span data-i18n="hero_see_pricing"></span></a>
      </div>

      <div class="steps">
        <div class="step">
          <div class="n">1</div>
          <strong data-i18n="step1_title"></strong>
          <p data-i18n="step1_body"></p>
        </div>
        <div class="step">
          <div class="n">2</div>
          <strong data-i18n="step2_title"></strong>
          <p data-i18n="step2_body"></p>
        </div>
        <div class="step">
          <div class="n">3</div>
          <strong data-i18n="step3_title"></strong>
          <p data-i18n="step3_body"></p>
        </div>
      </div>
    </div>
  </header>

  <section id="about">
    <div class="wrap">
      <div class="section-head">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.6-9.5-9.1C.8 8.4 2.3 5 5.8 5c2 0 3.3 1.1 4.2 2.4C10.9 6.1 12.2 5 14.2 5c3.5 0 5 3.4 3.3 6.9C15 16.4 12 21 12 21Z"/></svg></div>
        <h2 data-i18n="about_h2"></h2>
      </div>
      <div class="about-grid">
        <div class="about-card"><p data-i18n="about_p1"></p></div>
        <div class="about-card">
          <p data-i18n="about_p2"></p>
          <div class="pill-row">
            <span class="pill" data-i18n="pill1"></span>
            <span class="pill" data-i18n="pill2"></span>
            <span class="pill" data-i18n="pill3"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="offer" style="border-bottom:1px solid var(--line);">
    <div class="wrap">
      <div class="offer">
        <div>
          <h3 data-i18n="offer_h3"></h3>
          <div class="price-old">300–400 SAR</div>
        </div>
        <div class="amt">200–300 SAR</div>
      </div>
    </div>
  </section>

  <section id="pricing">
    <div class="wrap">
      <div class="section-head">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h18M3 6h18M3 18h12"/></svg></div>
        <h2 data-i18n="pricing_h2"></h2>
        <p data-i18n="pricing_sub"></p>
      </div>

      <div class="tabs" id="priceTabs" role="tablist"></div>
      <div id="priceGroups"></div>

      <p class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 16.5h.01M12 3l9 16.5H3L12 3Z"/></svg>
        <span data-i18n="pricing_note"></span>
      </p>
    </div>
  </section>

  <section id="booking" class="consult">
    <div class="wrap">
      <div class="section-head">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12c0-4 2-8 8-8s8 4 8 8-2 8-8 8c-1.2 0-2.3-.16-3.3-.46L4 21l1.6-4.4C4.6 15.3 4 13.7 4 12Z"/></svg></div>
        <h2 data-i18n="booking_h2"></h2>
        <p data-i18n="booking_sub"></p>
      </div>

      <form id="bookingForm" novalidate>
        <fieldset>
          <legend><span class="num">01</span><span data-i18n="fs1_title"></span></legend>
          <div class="field-grid">
            <div class="field">
              <label for="f-name" data-i18n="f_name"></label>
              <input id="f-name" name="name" type="text" required autocomplete="name">
            </div>
            <div class="field">
              <label for="f-phone" data-i18n="f_phone"></label>
              <input id="f-phone" name="phone" type="tel" required autocomplete="tel" placeholder="05xxxxxxxx">
            </div>
            <div class="field full">
              <label for="f-timing" data-i18n="f_timing"></label>
              <input id="f-timing" name="timing" type="text" required data-i18n-ph="ph_timing">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><span class="num">02</span><span data-i18n="fs2_title"></span></legend>

          <div class="field full" style="margin-bottom:16px;">
            <label data-i18n="q_natural"></label>
            <div class="radio-row" id="f-natural"></div>
          </div>

          <div class="field full" style="margin-bottom:16px;">
            <label for="f-history" data-i18n="q_history"></label>
            <textarea id="f-history" name="history" data-i18n-ph="ph_history"></textarea>
          </div>

          <div class="field-grid" style="margin-bottom:16px;">
            <div class="field">
              <label for="f-texture" data-i18n="f_texture"></label>
              <select class="form-select" id="f-texture" name="texture" required></select>
            </div>
            <div class="field">
              <label for="f-thickness" data-i18n="f_thickness"></label>
              <select class="form-select" id="f-thickness" name="thickness" required></select>
            </div>
            <div class="field">
              <label for="f-currentcolor" data-i18n="f_currentcolor"></label>
              <input id="f-currentcolor" name="currentColor" type="text" required data-i18n-ph="ph_currentcolor">
            </div>
            <div class="field">
              <label for="f-length" data-i18n="f_length"></label>
              <select class="form-select" id="f-length" name="length" required></select>
            </div>
          </div>

          <div class="length-guide" aria-hidden="true">
            <svg width="150" height="46" viewBox="0 0 150 46">
              <line x1="10" y1="23" x2="140" y2="23" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
              <circle cx="10" cy="23" r="4" fill="var(--accent-deep)"/>
              <circle cx="53" cy="23" r="4" fill="var(--accent-deep)"/>
              <circle cx="96" cy="23" r="4" fill="var(--accent-deep)"/>
              <circle cx="140" cy="23" r="4" fill="var(--accent-deep)"/>
              <text id="lg-short" x="10" y="40" font-size="9" fill="var(--ink-soft)" text-anchor="middle"></text>

  /* ================= language switching ================= */
  function getInitialLang(){
    try{
      var saved = localStorage.getItem('lb_lang');
      if(LANGS.indexOf(saved) !== -1) return saved;
    }catch(e){}
    var nav = (navigator.language || '').toLowerCase();
    for(var i=0;i<LANGS.length;i++){ if(nav.indexOf(LANGS[i]) === 0) return LANGS[i]; }
    return 'ar';
  }
  var currentLang = getInitialLang();
  var DYNA = []; // {el, map} for JS-generated content

  function applyLang(lang){
    currentLang = lang;
    app.classList.remove('lang-ar','lang-en','lang-de','lang-ru','lang-it','lang-tr');
    app.classList.add('lang-' + lang);
    app.setAttribute('dir', RTL[lang] ? 'rtl' : 'ltr');
    app.setAttribute('lang', lang);

    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var d = STR[el.dataset.i18n];
      if(d) el.textContent = d[lang];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var d = STR[el.dataset.i18nPh];
      if(d) el.placeholder = d[lang];
    });
    DYNA.forEach(function(d){ d.el.textContent = d.map[lang]; });

    document.getElementById('langSelect').value = lang;
    try{ localStorage.setItem('lb_lang', lang); }catch(e){}
  }

  document.getElementById('langSelect').addEventListener('change', function(){
    applyLang(this.value);
  });

  var mobilePanel = document.getElementById('mobilePanel');
  menuBtn.addEventListener('click', function(){
    var open = !mobilePanel.hidden;
    mobilePanel.hidden = open;
    menuBtn.setAttribute('aria-expanded', String(!open));
  });
  mobilePanel.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ mobilePanel.hidden = true; menuBtn.setAttribute('aria-expanded','false'); });
  });

  /* ---------------- build selects (single option per choice, relabeled on lang change) ---------------- */
  function buildSelect(id, list){
    var sel = document.getElementById(id);
    var ph = document.createElement('option');
    ph.value=''; ph.disabled=true; ph.selected=true;
    reg(ph, STR.select_ph);
    sel.appendChild(ph);
    list.forEach(function(o){
      var oEl=document.createElement('option'); oEl.value=o.value;
      reg(oEl, o);
      sel.appendChild(oEl);
    });
  }
  buildSelect('f-texture', TEXTURE);
  buildSelect('f-thickness', THICKNESS);
  buildSelect('f-length', LENGTH);

  function buildRadios(id, name, list, checkedFirst){
    var wrap = document.getElementById(id);
    list.forEach(function(o, i){
      var label = document.createElement('label'); label.className='opt';
      var input = document.createElement('input'); input.type='radio'; input.name=name; input.value=o.value;
      if(checkedFirst && i===0) input.checked = true;
      if(!checkedFirst) input.required = true;
      label.appendChild(input);
      var span = document.createElement('span');
      reg(span, o);
      label.appendChild(span);
      wrap.appendChild(label);
    });
  }
  buildRadios('f-natural','natural',NATURAL,false);
  buildRadios('f-trim','trim',TRIM,true);

  var servicesWrap = document.getElementById('f-services');
  SERVICES.forEach(function(o){
    var label = document.createElement('label'); label.className='opt';
    var input = document.createElement('input'); input.type='checkbox'; input.name='services'; input.value=o.value;
    label.appendChild(input);
    var span = document.createElement('span');
    reg(span, o);
    label.appendChild(span);
    servicesWrap.appendChild(label);
  });

  var LOOKUP = {};
  NATURAL.concat(TRIM,TEXTURE,THICKNESS,LENGTH,SERVICES).forEach(function(o){ LOOKUP[o.value] = o; });

  reg(document.getElementById('lg-short'), LENGTH[0]);
  reg(document.getElementById('lg-medium'), LENGTH[1]);
  reg(document.getElementById('lg-long'), LENGTH[2]);
  reg(document.getElementById('lg-xlong'), LENGTH[3]);

  /* ---------------- build pricing ---------------- */
  var tabsWrap = document.getElementById('priceTabs');
  var groupsWrap = document.getElementById('priceGroups');

  var allTab = document.createElement('button');
  allTab.className='tab'; allTab.type='button'; allTab.dataset.cat='all'; allTab.setAttribute('role','tab');
  reg(allTab, STR.tab_all);
  tabsWrap.appendChild(allTab);

  PRICE_CATEGORIES.forEach(function(cat){
    var tab = document.createElement('button');
    tab.className='tab'; tab.type='button'; tab.dataset.cat=cat.id; tab.setAttribute('role','tab');
    reg(tab, cat);
    tabsWrap.appendChild(tab);

    var group = document.createElement('div');
    group.className='price-group'; group.dataset.cat=cat.id;
    var h4 = document.createElement('h4');
    reg(h4, cat);
    group.appendChild(h4);

    cat.rows.forEach(function(block){
      if(block.sub){
        var subEl = document.createElement('div'); subEl.className='price-sub';
        reg(subEl, block.sub);
        group.appendChild(subEl);
      }
      block.items.forEach(function(item){
        var rowEl = document.createElement('div'); rowEl.className='price-row';
        var lbl = document.createElement('span'); lbl.className='lbl';
        reg(lbl, item);
        var val = document.createElement('span'); val.className='val';
        val.textContent = item.price;
        rowEl.appendChild(lbl); rowEl.appendChild(val);
        group.appendChild(rowEl);
      });
    });
    groupsWrap.appendChild(group);
  });

  function selectTab(cat){
    tabsWrap.querySelectorAll('.tab').forEach(function(t){
      t.setAttribute('aria-selected', String(t.dataset.cat === cat));
    });
    groupsWrap.querySelectorAll('.price-group').forEach(function(g){
      g.hidden = !(cat === 'all' || g.dataset.cat === cat);
    });
  }
  tabsWrap.addEventListener('click', function(e){
    var btn = e.target.closest('.tab');
    if(!btn) return;
    selectTab(btn.dataset.cat);
  });
  selectTab('all');

  /* ---------------- form submit ---------------- */
  var form = document.getElementById('bookingForm');
  var msg = document.getElementById('formMsg');

  function labelFor(value){
    var o = LOOKUP[value];
    if(!o) return value;
    return o[currentLang];
  }
  function s(key){ return STR[key][currentLang]; }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = form.name.value.trim();
    var phone = form.phone.value.trim();
    var timing = form.timing.value.trim();
    var natural = form.natural.value;
    var texture = form.texture.value;
    var thickness = form.thickness.value;
    var currentColor = form.currentColor.value.trim();
    var length = form.length.value;
    var deposit = form.deposit.checked;

    if(!name || !phone || !timing || !natural || !texture || !thickness || !currentColor || !length){
      msg.textContent = s('msg_missing');
      return;
    }
    if(!deposit){
      msg.textContent = s('msg_deposit');
      return;
    }

    var services = Array.prototype.slice.call(form.querySelectorAll('input[name="services"]:checked')).map(function(el){ return labelFor(el.value); });
    var history = form.history.value.trim() || '—';
    var desired = form.desired.value.trim() || '—';
    var trim = labelFor(form.trim.value);
    var notes = form.notes.value.trim() || '—';

    var lines = [
      s('msg_title'), '',
      s('msg_name') + ': ' + name,
      s('msg_phone') + ': ' + phone,
      s('msg_timing') + ': ' + timing, '',
      s('msg_histHead'),
      s('msg_naturalL') + ': ' + labelFor(natural),
      s('msg_historyL') + ': ' + history,
      s('msg_textureL') + ': ' + labelFor(texture),
      s('msg_thicknessL') + ': ' + labelFor(thickness),
      s('msg_currentColorL') + ': ' + currentColor,
      s('msg_lengthL') + ': ' + labelFor(length), '',
      s('msg_reqHead'),
      s('msg_servicesL') + ': ' + (services.length ? services.join('، ') : '—'),
      s('msg_desiredL') + ': ' + desired,
      s('msg_trimL') + ': ' + trim,
      s('msg_notesL') + ': ' + notes, '',
      s('msg_confirm')
    ];

    var text = encodeURIComponent(lines.join('\n'));
    var url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + text;
    msg.textContent = s('msg_opening');
    window.open(url, '_blank', 'noopener');
  });

  /* ---------------- init ---------------- */
  applyLang(currentLang);
})();
</script>
